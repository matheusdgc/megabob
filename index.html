<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Megabob</title>
    <link rel="icon" type="image/png" href="/assets/icons/bob_life.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* Phaser centers the canvas (autoCenter) with margins and gives its HTML text layer the
         same margins, so the two stay aligned; both are placed from the top-left corner here. */
      #game {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game > div {
        top: 0;
        left: 0;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
